name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the NVDA-compatible floor; 3.13 covers newer local dev
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Do NOT install wxPython here: tests/conftest.py mocks wx via
      # sys.modules, and a real wx install would break those mocks.
      - name: Install test dependencies
        run: pip install pytest pytest-cov pytest-timeout hypothesis polib wcwidth scons markdown

      - name: Install translation compiler
        run: |
          choco install gettext --version=1.0.0.20260310 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramFiles\gettext-iconv\bin" >> $env:GITHUB_PATH

      - name: Build add-on for package tests
        run: python -m SCons -Q

      - name: Run tests
        run: python -m pytest tests/ -q --timeout=120
